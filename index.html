<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>練習課題ボード</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="練習課題ボード">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // ホーム画面のアイコンから開いたときは、すぐアプリ本体へ
  var APP = 'https://script.google.com/macros/s/AKfycbx9IxckvHvW0skKEuB3O5koVSP1UAvP6PdITBzauD1Z0t9fdK4Vy8eSrpvrgE6TeQjEQA/exec';
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // ホーム画面のアイコンから開いたとき、またはiPhone以外（Android・PC）は、すぐアプリ本体へ
  if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches || !isIOS) location.replace(APP);
  var inApp = /Line\/|FBAN|FBAV|Instagram/i.test(ua) || (isIOS && !/Safari\//.test(ua));
</script>
<style>
  :root { --bg: #13294b; --card: #ffffff; --text: #172238; --sub: #64708a; --accent: #f07b1d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: grid; place-items: center; padding: 24px 16px; }
  .card { background: var(--card); border-radius: 18px; padding: 28px 20px; max-width: 420px; width: 100%; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  h1 { font-size: 22px; margin: 14px 0 6px; }
  p { margin: 0 0 18px; color: var(--sub); font-size: 14px; line-height: 1.7; }
  ol { text-align: left; font-size: 15px; line-height: 1.9; margin: 0 0 20px; padding-left: 1.4em; }
  b { color: var(--text); }
  .warn { background: #fff1e5; color: var(--text); border-radius: 12px; padding: 12px; text-align: left; }
  [hidden] { display: none !important; }
  a.btn { display: block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700;
    font-size: 17px; padding: 15px; border-radius: 14px; }
</style>
</head>
<body>
  <div class="card">
    <img src="apple-touch-icon.png" alt="">
    <h1>練習課題ボード</h1>
    <p>ホーム画面に追加すると、アプリのようにすぐ開けます。</p>
    <p class="warn" id="inAppNote" hidden>LINEなどのアプリの中で開いています。<br>右下（または右上）のメニューから<b>「Safariで開く」</b>を選んでから、下の手順で追加してください。</p>
    <ol>
      <li>Safariの下（または上）の<b>共有ボタン</b>をタップ</li>
      <li><b>「ホーム画面に追加」</b>をタップ</li>
      <li>右上の<b>「追加」</b>をタップ</li>
    </ol>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbx9IxckvHvW0skKEuB3O5koVSP1UAvP6PdITBzauD1Z0t9fdK4Vy8eSrpvrgE6TeQjEQA/exec">今すぐアプリを開く</a>
  </div>
<script>if (inApp) document.getElementById('inAppNote').hidden = false;</script>
</body>
</html>
